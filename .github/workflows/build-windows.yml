name: Build Windows app
on:
  workflow_dispatch:
  push:
    paths: ['windows-app/**', 'hr-system.html', '.github/workflows/build-windows.yml']
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: EGISHR-Windows
          path: |
            windows-app/dist/*.exe
