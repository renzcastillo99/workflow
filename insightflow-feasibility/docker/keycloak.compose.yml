# Free local OIDC identity provider for the mini portal (Docker Hub image keycloak/keycloak). DEV MODE ONLY: http, embedded DB.
name: if-keycloak
services:
  keycloak:
    image: keycloak/keycloak:latest
    container_name: if-keycloak
    command: ["start-dev", "--import-realm", "--http-enabled=true", "--hostname-strict=false"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: kcadmin
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KC_ADMIN_PASSWORD:?run scripts/p2_00_env.sh}"
    volumes: ["./keycloak/realm:/opt/keycloak/data/import:ro"]
    ports: ["127.0.0.1:8180:8080"]     # loopback only
    networks: [ifnet]
networks: { ifnet: { name: ifnet, external: true } }
