name: if-superset
services:
  ss-pg:
    image: postgres:16-alpine
    container_name: if-ss-pg
    environment: { POSTGRES_USER: superset, POSTGRES_PASSWORD: "${SS_DB_PASSWORD:?run scripts/init_env.sh}", POSTGRES_DB: superset }
    networks: [ifnet]
    volumes: [sspg:/var/lib/postgresql/data]
  ss-redis:
    image: redis:7-alpine
    container_name: if-ss-redis
    networks: [ifnet]
  superset:
    build: { context: ./, dockerfile: superset/Dockerfile }
    image: insightflow/superset:6.1.0-pg
    container_name: if-superset
    depends_on: [ss-pg, ss-redis]
    environment:
      SUPERSET_SECRET_KEY: "${SUPERSET_SECRET_KEY}"
      SS_DB_PASSWORD: "${SS_DB_PASSWORD}"
      SS_GUEST_TOKEN_SECRET: "${SS_GUEST_TOKEN_SECRET}"
      SS_RATELIMIT: "${SS_RATELIMIT:-50 per second}"
      SS_PORTAL_ORIGINS: "${SS_PORTAL_ORIGINS:-}"
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
    volumes: ["./superset/superset_config.py:/app/pythonpath/superset_config.py:ro"]
    command: ["gunicorn","--bind","0.0.0.0:8088","--workers","4","--worker-class","gthread","--threads","8","--timeout","120","--limit-request-line","0","--limit-request-field_size","0","superset.app:create_app()"]
    ports: ["127.0.0.1:8088:8088"]                 # loopback only
    networks: [ifnet]
volumes: { sspg: {} }
networks: { ifnet: { name: ifnet, external: true } }
