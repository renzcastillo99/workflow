<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portal prototype (feasibility only)</title>
<style>html,body{margin:0;height:100%}#dash{height:100vh}#dash iframe{width:100%;height:100%;border:0}</style>
<div id="dash"></div><script src="sdk.js"></script>
<script>
const q = new URLSearchParams(location.search);
window.mount({ id: q.get('uuid'), supersetDomain: 'http://127.0.0.1:8088', mountPoint: document.getElementById('dash'),
  fetchGuestToken: () => fetch('/token?dash=' + q.get('dash')).then(r => r.text()),
  dashboardUiConfig: { hideTitle: true, hideChartControls: true, hideTab: true, filters: { expanded: false } } });
</script>
